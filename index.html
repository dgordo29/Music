<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Suno Studio</title>
  <meta name="description" content="Create songs, lyrics, covers, stems and music videos with the Suno API — bring your own key." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236d4aff'/><stop offset='.6' stop-color='%23ff4f8b'/><stop offset='1' stop-color='%23ffb547'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/><path d='M40 70V32l30-6v38' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='33' cy='70' r='9' fill='white'/><circle cx='63' cy='64' r='9' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('ss.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-glow two" aria-hidden="true"></div>

  <!-- Rendered by assets/app.js -->
  <div id="root"></div>
  <div id="player-root"></div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>

  <noscript><p style="padding:24px">Suno Studio needs JavaScript enabled.</p></noscript>
  <script src="assets/app.js"></script>
</body>
</html>
